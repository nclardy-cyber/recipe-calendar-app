<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Recipe Calendar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ===== Whole-page scaling =====
           Every size in this UI is rem-based, and the root font-size
           grows fluidly with the viewport, so the entire page scales
           continuously with screen size: compact baseline on a phone,
           larger on a laptop, and even larger on a desktop monitor or 4K TV. */
        html {
            font-size: clamp(16px, 13px + 0.55vw, 22px); /* px on purpose: root scale anchor */
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .login-container {
            background: white;
            padding: 2.5rem;
            border-radius: 1.25rem;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 25rem;
            width: 90%;
        }
        
        .logo {
            text-align: center;
            margin-bottom: 1.562rem;
        }
        
        .logo h1 {
            color: #667eea;
            font-size: 2rem;
            margin-bottom: 0.312rem;
        }
        
        .logo p {
            color: #888;
            font-size: 0.9rem;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 0.625rem;
            margin-bottom: 1.25rem;
            font-size: 0.9rem;
            color: #666;
        }

        .remember-me input[type="checkbox"] {
            width: 1.125rem;
            height: 1.125rem;
            accent-color: #667eea;
            cursor: pointer;
        }

        .form-group input {
            width: 100%;
            padding: 0.938rem;
            border: 2px solid #e9ecef;
            border-radius: 0.625rem;
            font-size: 1rem;
            transition: border 0.3s, box-shadow 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        }

        .forgot-password {
            text-align: right;
            margin-top: -0.938rem;
            margin-bottom: 0.938rem;
        }

        .forgot-password a {
            color: #667eea;
            font-size: 0.85rem;
            text-decoration: none;
            font-weight: 500;
        }

        .forgot-password a:hover {
            text-decoration: underline;
        }

        .login-btn {
            margin-bottom: 1.25rem;
        }
        
        .form-group label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 0.95rem;
        }
        
        .form-group input {
            width: 100%;
            padding: 0.938rem;
            border: 2px solid #e9ecef;
            border-radius: 0.625rem;
            font-size: 1rem;
            transition: border 0.3s, box-shadow 0.3s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        }
        
        .login-btn {
            width: 100%;
            padding: 0.938rem;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 0.625rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 0.625rem;
        }
        
        .login-btn:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .login-btn:active {
            transform: translateY(0);
        }
        
        .message {
            padding: 0.75rem;
            border-radius: 0.5rem;
            margin-bottom: 1.25rem;
            text-align: center;
            font-size: 0.9rem;
            display: none;
        }
        
        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .message.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
            word-break: break-all;
        }

        .resend-verification {
            margin-top: 1.25rem;
            padding-top: 1rem;
            border-top: 1px solid #e9ecef;
        }

        .resend-label {
            display: block;
            color: #888;
            font-size: 0.85rem;
            margin-bottom: 0.5rem;
            text-align: center;
        }

        .resend-row {
            display: flex;
            gap: 0.5rem;
        }

        .resend-row input {
            flex: 1;
            padding: 0.625rem 0.75rem;
            border: 2px solid #e9ecef;
            border-radius: 0.5rem;
            font-size: 0.9rem;
        }

        .resend-row input:focus {
            outline: none;
            border-color: #667eea;
        }

        .resend-btn {
            padding: 0.625rem 1rem;
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
            border-radius: 0.5rem;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .resend-btn:hover {
            background: #667eea;
            color: white;
        }

        .footer {
            text-align: center;
            margin-top: 1.562rem;
            padding-top: 1.25rem;
            border-top: 1px solid #e9ecef;
        }
        
        .footer a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }
        
        .footer a:hover {
            text-decoration: underline;
        }
        
        @media (max-width: 480px) {
            .login-container {
                padding: 1.562rem;
            }
            
            .logo h1 {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>📅 Recipe Calendar</h1>
            <p>Welcome back! Please sign in to continue</p>
        </div>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="message {{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        
        <form method="POST" action="/login" class="login-form">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" value="{{ email or '' }}" placeholder="Enter your email" autofocus required>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>
            
            <div class="remember-me">
                <input type="checkbox" id="remember" name="remember">
                <label for="remember">Remember me</label>
            </div>
            
            <div class="forgot-password">
                <a href="/reset-password">Forgot password?</a>
            </div>
            
            <button type="submit" class="login-btn">Sign In</button>
        </form>
        
        <div class="resend-verification">
            <form method="POST" action="/resend-verification">
                <label for="resend-email" class="resend-label">Didn't get a verification email?</label>
                <div class="resend-row">
                    <input type="email" id="resend-email" name="email" placeholder="Enter your email" required>
                    <button type="submit" class="resend-btn">Resend</button>
                </div>
            </form>
        </div>
        
        <div class="footer">
            <p>Don't have an account?</p>
            <a href="/signup">Create an account</a>
        </div>
    </div>
</body>
</html>
