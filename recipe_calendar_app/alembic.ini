# Alembic configuration for the recipe calendar app.
#
# The live database URL is supplied at runtime:
#   - `flask db ...` commands inject the app's SQLALCHEMY_DATABASE_URI
#     (which itself honors the DATABASE_URL environment variable).
#   - Standalone `alembic ...` runs (e.g. the test suite) set
#     sqlalchemy.url explicitly on the Config object.
# Keep the value below empty; do not commit a real connection string here.
[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
